<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Style guide</title>
    </head>
    <body>

    <h1>Style guide</h1>

    <p>The hottest color to wear right now is:
        <span id="trendy-color">?</span>
    </p>

    <p>This is the trendy way to sign an autograph:
        <span id="trendy-handwriting">?</span>
    </p>

    <p>This is the trendy way to frame photographs:
        <br>
        <img id="trendy-frame" src="https://www.kasandbox.org/programming-images/avatars/mr-pink.png" alt="Cool avatar">
    </p>


    <script>
    const colorEl = document.getElementById("trendy-color");
    const handEl  = document.getElementById("trendy-handwriting");
    const frameEl = document.getElementById("trendy-frame");

    colorEl.textContent = "orange";
    colorEl.style.color = "orange";

    handEl.textContent = "Taylor Swift";
    handEl.style.fontFamily = "serif";

    frameEl.style.border = "2px solid red";
    </script>

    </body>
</html>
