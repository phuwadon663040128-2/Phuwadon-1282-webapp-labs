<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/p2-gallery.css">
    <title>Nature Gallery</title>
</head>
<body>
    <header>
        <h1>Small Wonders of Nature</h1>
        <p>A collection of colours and details found in the natural world.</p>
    </header>

    <main>
        <img class="hero" src="images/butterfly2.jpg" alt="Green butterflies resting together on a leaf">

        <h2>Photo Gallery</h2>
        <div class="gallery">
            <figure class="tile">
                <img src="images/butterfly.jpg" alt="Green hairstreak butterfly resting on a leaf">
                <figcaption>Green hairstreak butterfly</figcaption>
            </figure>
            <figure class="tile">
                <img src="images/dragonfly.jpg" alt="Small orange beetle perched on the tip of a plant">
                <figcaption>Tiny beetle on a stem</figcaption>
            </figure>
            <figure class="tile">
                <img src="images/flower.jpg" alt="Small white flower photographed close up">
                <figcaption>A delicate white flower</figcaption>
            </figure>
            <figure class="tile">
                <img src="images/mango.jpg" alt="Ripe yellow canistel fruit on a green background">
                <figcaption>Bright tropical canistel fruit</figcaption>
            </figure>
            <figure class="tile tile-portrait">
                <img src="images/owl.jpg" alt="Brown owl sitting on a tree branch">
                <figcaption>An owl watching from a branch</figcaption>
            </figure>
            <figure class="tile">
                <img src="images/peacock.jpg" alt="Close view of a blue peacock">
                <figcaption>Blue peacock in full colour</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
